#bar{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:var(--gold);z-index:60}
.art{max-width:720px;margin:0 auto;padding:54px 5% 20px}
.art .cat{font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:10px}
.art h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.35;margin-bottom:16px}
.art .info{color:var(--muted);font-size:.88rem;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:28px}
.art .cov{width:100%;height:auto;border-radius:12px;display:block;margin:0 0 30px}
.body{font-size:1.1rem;line-height:2.05;color:#222}
.body.ar{font-family:'Noto Naskh Arabic','Noto Kufi Arabic',serif;font-size:1.22rem;line-height:2.1}
.body.en{font-family:var(--en);line-height:1.85}
.body h2{font-family:var(--ar);font-size:1.5rem;line-height:1.5;margin:42px 0 12px;color:#000}
.body.en h2,.body.en h3{font-family:var(--en)}
.body h3{font-family:var(--ar);font-size:1.2rem;margin:30px 0 10px}
.body p{margin-bottom:20px}
.body ul,.body ol{margin:0 0 22px;padding-inline-start:1.4em}.body li{margin-bottom:8px}
.body blockquote{margin:28px 0;padding:6px 22px;border-inline-start:3px solid var(--gold);font-size:1.25rem;color:#000;background:#faf8f6;border-radius:4px}
.body a{color:#000;text-decoration:underline;text-underline-offset:4px}
.body figure{margin:28px 0}.body img{max-width:100%;height:auto;border-radius:10px;display:block;margin:auto}
.body hr{border:0;border-top:1px solid var(--line);margin:36px 0}
.body code{background:#f1eee9;padding:1px 6px;border-radius:4px;font-size:.92em}
.share{display:flex;gap:10px;flex-wrap:wrap;margin:34px 0 10px;padding-top:22px;border-top:1px solid var(--line)}
.share a,.share button{border:1px solid #cfcbc6;background:#fff;border-radius:99px;padding:8px 18px;font:inherit;font-size:.86rem;text-decoration:none;color:var(--ink);cursor:pointer}
.share a:hover,.share button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctab{max-width:720px;margin:34px auto 0;padding:0 5%}
.ctab div{background:var(--brown);color:#fff;border-radius:12px;padding:30px;text-align:center}
.ctab h3{font-size:1.4rem;margin-bottom:8px}.ctab p{opacity:.8;font-weight:300;margin-bottom:18px}
.ctab a{display:inline-block;background:#fff;color:var(--brown);padding:12px 26px;border-radius:4px;font-weight:700;text-decoration:none}
.more{max-width:1120px;margin:60px auto 0;padding:0 5%}.more h2{font-size:1.5rem;margin-bottom:18px}
.nf{padding:90px 5%;text-align:center;color:var(--muted)}
</style>

<script src="md.js"></script>
<script src="posts-data.js"></script>
<script>
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d,l){try{return new Intl.DateTimeFormat(l==='ar'?'ar-u-ca-gregory':'en-GB',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T00:00:00'))}catch(e){return d}}
var UIL={ar:{min:'دقائق قراءة',back:'← المقالات'},en:{min:'min read',back:'← Articles'}};
function card(p,ui){
  var cov=p.cover?'<img src="'+esc(p.cover)+'" alt="" loading="lazy" onerror="this.remove()">':'';
  return '<a class="bcard rv" href="post.html?p='+encodeURIComponent(p.slug)+'"><div class="cv">'+(cov||esc((p.title||'K').charAt(0)))+'</div><div class="tx"><div class="ct">'+esc(p.category||'')+'</div><h3 dir="'+(p.lang==='ar'?'rtl':'ltr')+'">'+esc(p.title)+'</h3><p dir="'+(p.lang==='ar'?'rtl':'ltr')+'">'+esc(p.excerpt||'')+'</p><div class="mt">'+fmt(p.date,ui)+' · '+p.read+' '+UIL[ui].min+'</div></div></a>'}
function reveal(){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}})},{threshold:.06,rootMargin:'0px 0px -30px 0px'});document.querySelectorAll('.rv').forEach(function(e){io.observe(e)})}
var lang='ar',slug=new URLSearchParams(location.search).get('p')||'',list=window.POSTS||[],P=list.filter(function(x){return x.slug===slug})[0];
function apply(){
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;
  document.body.classList.toggle('en',lang==='en');$('#lang').textContent=lang==='ar'?'EN':'AR';
  document.querySelectorAll('[data-ar]').forEach(function(e){e.textContent=e.getAttribute('data-'+lang)});
  if(P){$('#info').textContent=fmt(P.date,lang)+' · '+P.read+' '+UIL[lang].min;
    $('#mg').innerHTML=list.filter(function(x){return x.slug!==P.slug}).sort(function(a,b){return a.date<b.date?1:-1}).slice(0,2).map(function(x){return card(x,lang)}).join('');
    $('#more').hidden=!$('#mg').children.length;reveal()}
}
$('#lang').onclick=function(){lang=lang==='ar'?'en':'ar';apply()};
if(!P){var rm=document.createElement('meta');rm.name='robots';rm.content='noindex';document.head.appendChild(rm);$('#nf').hidden=false;apply()}
else{
  lang=P.lang||'ar';
  fetch('posts/'+encodeURIComponent(P.slug)+'.md',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
    var a=$('#art');a.dir=P.lang==='ar'?'rtl':'ltr';a.hidden=false;$('#ctab').hidden=false;
    $('#cat').textContent=P.category||'';$('#ttl').textContent=P.title;
    var b=$('#body');b.className='body '+(P.lang==='ar'?'ar':'en');b.innerHTML=md(t);
    if(P.cover){var c=$('#cov');c.src=P.cover;c.alt=P.title;c.hidden=false;c.onerror=function(){c.hidden=true}}
    document.title=P.title+' | كمال النحراوي';
    var cu=location.origin+'/post.html?p='+encodeURIComponent(P.slug),cl=document.querySelector('link[rel=canonical]');if(cl)cl.href=cu;
    var ld={'@context':'https://schema.org','@type':'Article',headline:P.title,description:P.excerpt||'',datePublished:P.date,inLanguage:P.lang,author:{'@type':'Person',name:'Kamal Elnhrawy'},mainEntityOfPage:cu};
    if(P.cover)ld.image=location.origin+'/'+P.cover;
    var sj=document.createElement('script');sj.type='application/ld+json';sj.textContent=JSON.stringify(ld);document.head.appendChild(sj);
    var m=document.querySelector('meta[name=description]');if(m)m.content=P.excerpt||P.title;
    $('#wa').href='https://wa.me/?text='+encodeURIComponent(P.title+' '+location.href);
    $('#cp').onclick=function(){var s=this;(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(function(){s.textContent=lang==='ar'?'تم النسخ ✓':'Copied ✓'}).catch(function(){})};
    apply();
  }).catch(function(){var rm=document.createElement('meta');rm.name='robots';rm.content='noindex';document.head.appendChild(rm);$('#nf').hidden=false;apply()});
  window.addEventListener('scroll',function(){var h=document.documentElement,s=h.scrollTop/(h.scrollHeight-h.clientHeight||1);$('#bar').style.width=Math.min(100,s*100)+'%'},{passive:true});
}
</script>
</body>
