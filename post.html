<style>
#bar{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:var(--gold);z-index:60}
.art{max-width:760px;margin:0 auto;padding:48px 5% 20px}
.art .cat{font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:10px}
.art h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.5;margin-bottom:16px}
.art .info{color:var(--muted);font-size:.86rem;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:28px}
.art .cov{width:100%;height:auto;border-radius:12px;display:block;margin:0 0 30px}
.body{font-size:1.08rem;line-height:2;color:#222;overflow-wrap:anywhere}
.body.ar{font-family:'Noto Naskh Arabic','Noto Kufi Arabic',serif;font-size:1.22rem;line-height:2.05}
.body h2{font-family:var(--ar);font-size:1.45rem;line-height:1.6;margin:38px 0 12px;color:#000}
.body h3{font-family:var(--ar);font-size:1.16rem;margin:28px 0 10px}
.body p{margin-bottom:18px}
.body ul,.body ol{margin:0 0 22px;padding-inline-start:1.4em}.body li{margin-bottom:8px}
.body blockquote{margin:26px 0;padding:8px 20px;border-inline-start:3px solid var(--gold);font-size:1.15rem;color:#000;background:#faf8f6;border-radius:4px}
.body a{color:#000;text-decoration:underline;text-underline-offset:4px}
.body img{max-width:100%;height:auto;border-radius:10px}
.body hr{border:0;border-top:1px solid var(--line);margin:34px 0}
.body code{background:#f1eee9;padding:1px 6px;border-radius:4px;font-size:.92em}
.share{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 10px;padding-top:22px;border-top:1px solid var(--line)}
.share a,.share button{border:1px solid #cfcbc6;background:#fff;border-radius:99px;padding:8px 18px;font:inherit;font-size:.86rem;text-decoration:none;color:var(--ink);cursor:pointer}
.share a:hover,.share button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctab{max-width:760px;margin:30px auto 0;padding:0 5%}
.ctab>div{background:var(--brown);color:#fff;border-radius:12px;padding:28px;text-align:center}
.ctab h2{font-size:1.35rem;margin-bottom:8px}.ctab p{opacity:.85;margin-bottom:16px}
.ctab a{display:inline-block;background:#fff;color:var(--brown);padding:10px 24px;border-radius:4px;font-weight:700;text-decoration:none}
.more{max-width:1120px;margin:54px auto 0;padding:0 5%}.more h2{font-size:1.4rem;margin-bottom:18px}
.nf{padding:90px 5%;text-align:center;color:var(--muted)}
@media(max-width:760px){.art{padding-top:34px}.body.ar{font-size:1.12rem}.body h2{font-size:1.3rem}.ctab>div{padding:22px}}
</style>
</head>
<body>
<div id="bar"></div>
<header>
  <a class="back" id="back" href="blog.html">← المقالات</a>
  <a class="logo" href="index.html">Kamal Elnhrawy</a>
</header>
<main>
  <article class="art" id="art" hidden>
    <div class="cat" id="cat"></div><h1 id="ttl"></h1><div class="info" id="info"></div>
    <img class="cov" id="cov" alt="" hidden>
    <div class="body" id="body"></div>
    <div class="share"><a id="wa" target="_blank" rel="noopener noreferrer">مشاركة عبر واتساب</a><button id="cp" type="button">نسخ رابط المقال</button></div>
  </article>
  <p class="nf" id="nf" hidden>لم يُعثر على هذا المقال. ارجع لصفحة المقالات واختار مقالًا موجودًا.</p>
  <div class="ctab" id="ctab" hidden><div><h2>عندك متجر أو مشروع وعايز تطوره؟</h2><p>شوف المشاريع والباقات المتاحة أو تواصل مباشرة.</p><a href="packages.html">الباقات والأسعار</a></div></div>
  <section class="more" id="more" hidden><h2>مقالات تانية</h2><div class="bgrid" id="mg"></div></section>
</main>
<footer>
  <div class="soc">
    <a href="https://wa.me/201123449977" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
    <a href="https://facebook.com/hi19man" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
  </div>
  <p class="cp">© 2026 Kamal Elnhrawy</p>
</footer>
<script src="md.js"></script>
<script src="posts-data.js?v=9"></script>
<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s)};
  function fmt(d){try{return new Intl.DateTimeFormat('ar-u-ca-gregory',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T00:00:00'))}catch(e){return d||''}}
  function setMeta(selector,content){var node=document.querySelector(selector);if(node)node.setAttribute('content',content)}
  function card(p){
    var cover=p.cover?'<img src="'+esc(p.cover)+'" alt="" loading="lazy" onerror="this.remove()">':esc((p.title||'م').slice(0,1));
    var labels='<div class="card-labels"><span class="ct">'+esc(p.category||'')+'</span>'+(p.column?'<span class="writer">بقلم كمال النحراوي</span>':'')+'</div>';
    return '<a class="bcard" href="post.html?p='+encodeURIComponent(p.slug)+'"><div class="cv">'+cover+'</div><div class="tx">'+labels+'<h3>'+esc(p.title||'')+'</h3><p>'+esc(p.excerpt||'')+'</p><div class="mt">'+fmt(p.date)+' · '+esc(p.read||'')+' دقائق قراءة</div></div></a>';
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var slug=new URLSearchParams(location.search).get('p')||'';
  var list=Array.isArray(window.POSTS)?window.POSTS:[];
  var P=list.filter(function(x){return x.slug===slug})[0];
  function notFound(){
    $('#nf').hidden=false;
    setMeta('meta[name="robots"]','noindex,follow');
    setMeta('meta[name="description"]','المقال غير متاح. تصفح المقالات الأخرى على موقع كمال النحراوي.');
  }
  if(!P){notFound()}
  else{
    fetch('posts/'+encodeURIComponent(P.slug)+'.md',{cache:'no-cache'}).then(function(r){
      if(!r.ok)throw new Error('Article Markdown file not found');
      return r.text();
    }).then(function(source){
      $('#art').hidden=false;$('#ctab').hidden=false;
      $('#cat').textContent=P.category||'';
      $('#ttl').textContent=P.title||'';
      $('#info').textContent=fmt(P.date)+' · '+(P.read||'')+' دقائق قراءة'+(P.column?' · بقلم '+(P.author||'كمال النحراوي'):'');
      $('#art').dir=P.lang==='ar'?'rtl':'ltr';
      $('#body').className='body '+(P.lang==='ar'?'ar':'en');
      $('#body').innerHTML=window.md(source);
      if(P.cover){$('#cov').src=P.cover;$('#cov').alt=P.title||'';$('#cov').hidden=false;$('#cov').onerror=function(){this.hidden=true}}
      var url=location.origin+location.pathname+'?p='+encodeURIComponent(P.slug);
      var canonical=document.querySelector('link[rel="canonical"]');
      if(canonical)canonical.href=url;
      document.title=(P.title||'مقال')+' | كمال النحراوي';
      setMeta('meta[name="description"]',P.excerpt||P.title||'مقال من مدونة كمال النحراوي.');
      setMeta('meta[property="og:title"]',(P.title||'مقال')+' | كمال النحراوي');
      setMeta('meta[property="og:description"]',P.excerpt||P.title||'');
      setMeta('meta[property="og:url"]',url);
      setMeta('meta[name="twitter:title"]',(P.title||'مقال')+' | كمال النحراوي');
      setMeta('meta[name="twitter:description"]',P.excerpt||P.title||'');
      var ld={'@context':'https://schema.org','@type':'Article',headline:P.title||'',description:P.excerpt||'',datePublished:P.date||'',inLanguage:P.lang||'ar',author:{'@type':'Person',name:'Kamal Elnhrawy'},mainEntityOfPage:url};
      if(P.cover){var imageUrl=new URL(P.cover,location.href).href;setMeta('meta[property="og:image"]',imageUrl);setMeta('meta[name="twitter:image"]',imageUrl);ld.image=imageUrl}
      var old=document.querySelector('script[type="application/ld+json"]');if(old)old.remove();
      var schema=document.createElement('script');schema.type='application/ld+json';schema.textContent=JSON.stringify(ld);document.head.appendChild(schema);
      $('#wa').href='https://wa.me/?text='+encodeURIComponent((P.title||'')+' '+url);
      $('#cp').addEventListener('click',function(){
        var button=this;
        function done(){button.textContent=document.documentElement.lang==='en'?'Copied':'تم النسخ'}
        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done).catch(function(){window.prompt('انسخ رابط المقال',url)})}
        else window.prompt('انسخ رابط المقال',url);
      });
      $('#mg').innerHTML=list.filter(function(x){return x.slug!==P.slug}).sort(function(a,b){return String(a.date)<String(b.date)?1:-1}).slice(0,2).map(card).join('');
      $('#more').hidden=!$('#mg').children.length;
    }).catch(function(){notFound()});
  }
  window.addEventListener('scroll',function(){
    var h=document.documentElement,range=h.scrollHeight-h.clientHeight;
    $('#bar').style.width=(range>0?Math.min(100,h.scrollTop/range*100):0)+'%';
  },{passive:true});
})();
</script>
</body>
</html>
