<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المشروعات | Kamal Elnhrawy</title>
<meta name="description" content="معرض متاجر وعلامات تجارية صممتها على Shopify وEasy Order.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Kufi+Arabic:wght@300;500;700&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="project.css">
<style>
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.chips button{background:#fff;border:1px solid #cfcbc6;border-radius:99px;padding:7px 18px;font:inherit;font-size:.88rem;cursor:pointer;transition:.25s}
.chips button.on,.chips button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;padding-bottom:30px}
.pcard{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s}
.pcard:hover{transform:translateY(-6px);box-shadow:0 18px 45px rgba(0,0,0,.08)}
.pcard .im{aspect-ratio:4/3;background:#f1eee9;overflow:hidden}
.pcard .im img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .6s}
.pcard:hover .im img{transform:scale(1.03)}
.pcard .tx{padding:18px 20px 22px}
.pcard .mt{display:flex;gap:10px;font-size:.74rem;color:var(--muted);margin-bottom:6px;direction:ltr;justify-content:flex-start}
html[dir=rtl] .pcard .mt{justify-content:flex-end}
.pcard h3{font-size:1.15rem;margin-bottom:8px}
.pcard p{font-size:.86rem;color:var(--muted);line-height:1.75;margin-bottom:12px}
.pcard .lk{font-size:.84rem;font-weight:700}
.cta{margin:30px 0 0;padding:44px 0 10px;border-top:1px solid var(--line);text-align:center}
.cta h2{font-size:clamp(1.6rem,3.4vw,2.4rem);margin-bottom:8px}
.cta p{color:var(--muted);font-weight:300;margin-bottom:22px}
.cta .btn+.btn{margin-inline-start:10px;background:#fff;color:var(--ink);border:1px solid #cfcbc6}
</style>
</head>
<body>
<header>
  <a class="back" href="design.html" data-ar="← الرئيسية" data-en="← Home">← الرئيسية</a>
  <a class="logo" href="index.html">Kamal Elnhrawy</a>
  <button id="lang" aria-label="Language">EN</button>
</header>
<main>
  <section class="wrap hero">
    <h1 class="rv" data-ar="المشروعات" data-en="Projects">المشروعات</h1>
    <p class="tag rv" data-ar="متاجر وعلامات تجارية صمّمتها، لأسواق مصر والخليج." data-en="Stores and brands I've designed, for Egypt and the Gulf.">متاجر وعلامات تجارية صمّمتها، لأسواق مصر والخليج.</p>
    <div class="chips rv" id="chips"></div>
  </section>
  <div class="wrap"><div class="pgrid" id="pgrid"></div></div>
  <div class="wrap"><section class="cta rv">
    <h2 data-ar="هل لديك مشروع مشابه؟" data-en="Have a similar project?">هل لديك مشروع مشابه؟</h2>
    <p data-ar="اختر باقة بسعر ثابت، أو راسلني على واتساب." data-en="Pick a fixed-price package, or message me on WhatsApp.">اختر باقة بسعر ثابت، أو راسلني على واتساب.</p>
    <a class="btn" href="packages.html" data-ar="الباقات والأسعار" data-en="Packages and pricing">الباقات والأسعار</a><a class="btn" href="https://wa.me/201123449977" target="_blank" rel="noopener" data-ar="واتساب" data-en="WhatsApp">واتساب</a>
  </section></div>
</main>
<footer>
  <div class="soc">
    <a href="https://wa.me/201123449977" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
    <a href="https://facebook.com/hi19man" target="_blank" rel="noopener" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
  </div>
  <p class="cp">© 2026 Kamal Elnhrawy</p>
</footer>
<script src="projects-data.js"></script>
<script>
var lang='ar',$=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var list=window.PROJECTS||[],cur='all';
$('#pgrid').innerHTML=list.map(function(p){
  return '<a class="pcard rv" data-p="'+esc(p.platform)+'" href="'+esc(p.href)+'"><div class="im"><img src="'+esc(p.cover)+'" alt="'+esc(p.title.en)+'" loading="lazy" onerror="this.parentNode.parentNode.remove()"></div><div class="tx"><div class="mt"><span>'+esc(p.platform)+'</span>'+(p.year?'<span>'+esc(p.year)+'</span>':'')+'</div><h3 data-ar="'+esc(p.title.ar)+'" data-en="'+esc(p.title.en)+'">'+esc(p.title.ar)+'</h3><p data-ar="'+esc(p.desc.ar)+'" data-en="'+esc(p.desc.en)+'">'+esc(p.desc.ar)+'</p><span class="lk" data-ar="عرض المشروع ←" data-en="View project →">عرض المشروع ←</span></div></a>'}).join('');
var plats=[];list.forEach(function(p){if(plats.indexOf(p.platform)<0)plats.push(p.platform)});
if(plats.length>1){
  $('#chips').innerHTML='<button class="on" data-f="all" data-ar="الكل" data-en="All">الكل</button>'+plats.map(function(x){return '<button data-f="'+esc(x)+'">'+esc(x)+'</button>'}).join('');
  $('#chips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cur=b.getAttribute('data-f');
    document.querySelectorAll('#chips button').forEach(function(x){x.classList.toggle('on',x===b)});
    document.querySelectorAll('.pcard').forEach(function(c){c.hidden=cur!=='all'&&c.getAttribute('data-p')!==cur})});
}else $('#chips').hidden=true;
function apply(){
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;
  document.body.classList.toggle('en',lang==='en');$('#lang').textContent=lang==='ar'?'EN':'AR';
  document.querySelectorAll('[data-ar]').forEach(function(e){e.textContent=e.getAttribute('data-'+lang)});
  document.title=lang==='ar'?'المشروعات | Kamal Elnhrawy':'Projects | Kamal Elnhrawy';
}
$('#lang').onclick=function(){lang=lang==='ar'?'en':'ar';apply()};
apply();
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}})},{threshold:.06,rootMargin:'0px 0px -30px 0px'});
document.querySelectorAll('.rv').forEach(function(e){io.observe(e)});
</script>
</body>
</html>
