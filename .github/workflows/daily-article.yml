name: Daily Blog Article

on:
  schedule:
    - cron: "7 9 * * *"
      timezone: "Africa/Cairo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-blog-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get today's Cairo date
        id: date
        run: |
          echo "today=$(TZ=Africa/Cairo date +%F)" >> "$GITHUB_OUTPUT"

      - name: Research and write article with Groq
        id: article
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TODAY: ${{ steps.date.outputs.today }}
        run: node .github/scripts/generate-article-groq.js

      - name: Generate unique topic-specific cover
        if: steps.article.outputs.publish == 'true'
        run: node .github/scripts/generate-cover.js

      - name: Validate research and article
        id: validate
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const cp = require("child_process");

          function fail(message) {
            console.error("Validation failed: " + message);
            process.exit(1);
          }
          function section(markdown, heading, nextHeading) {
            const start = markdown.indexOf(heading);
            if (start < 0) return [];
            const from = start + heading.length;
            const end = nextHeading ? markdown.indexOf(nextHeading, from) : -1;
            return markdown.slice(from, end < 0 ? undefined : end)
              .split(/\r?\n/)
              .map(line => line.trim())
              .filter(line => line.startsWith("- "));
          }

          if (!fs.existsSync("research-audit.md")) {
            fail("Article generator did not create research-audit.md; research cannot be verified.");
          }
          const audit = fs.readFileSync("research-audit.md", "utf8");
          const decisionMatch = audit.match(/DECISION:\s*(PUBLISH|SKIP)\b/i);
          if (!decisionMatch) fail("Audit must include DECISION: PUBLISH or DECISION: SKIP.");
          const decision = decisionMatch[1].toUpperCase();

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            "## Daily article research audit\n\n" + audit + "\n"
          );

          const createdPosts = cp.execSync(
            "git ls-files --others --exclude-standard -- 'posts/*.md'",
            { encoding: "utf8" }
          ).trim().split("\n").filter(Boolean);

          const headings = [
            "## English Search Queries",
            "## Arabic Market Search Queries",
            "## English Source Articles",
            "## Arabic-Market Results",
            "## Existing Site Duplicate Check",
            "## Decision"
          ];
          for (const heading of headings) {
            if (!audit.includes(heading)) fail("Missing audit heading: " + heading);
          }

          const enQueries = section(audit, headings[0], headings[1]);
          const arQueries = section(audit, headings[1], headings[2]);
          const enSources = section(audit, headings[2], headings[3]);
          const arFindings = section(audit, headings[3], headings[4]);
          const duplicateCheck = section(audit, headings[4], headings[5]);

          if (enQueries.length < 3 || !enQueries.every(line => /query:/i.test(line))) {
            fail("Audit must list at least 3 executed English search queries.");
          }
          if (arQueries.length < 3 ||
              !arQueries.every(line => /query:/i.test(line) && /[\u0600-\u06FF]/.test(line))) {
            fail("Audit must list at least 3 executed Arabic search queries.");
          }
          const sourceLinks = enSources.join("\n").match(/https?:\/\/[^\s)]+/g) || [];
          if (sourceLinks.length < 2) fail("Audit needs at least 2 direct English source URLs.");
          if (arFindings.join("\n").trim().length < 100) {
            fail("Arabic-market results and search limitations are not documented.");
          }
          if (duplicateCheck.join("\n").trim().length < 80) {
            fail("The comparison with existing blog articles is too brief.");
          }

          if (!fs.existsSync("web-search-log.json")) {
            fail("No web-search-log.json was created; real web research is unverified.");
          }
          let searchLog;
          try {
            searchLog = JSON.parse(fs.readFileSync("web-search-log.json", "utf8"));
          } catch (error) {
            fail("web-search-log.json is invalid: " + error.message);
          }
          if (!Array.isArray(searchLog)) fail("Web search log must be an array.");

          const successfulSearches = searchLog.filter(item =>
            item.type === "search" && item.ok === true &&
            Array.isArray(item.results) && item.results.some(r => r.url && /^https?:\/\//i.test(r.url))
          );
          const normalizeQueryLine = line => line.replace(/^- query:\s*/i, "").trim();
          const englishAuditQueries = enQueries.map(normalizeQueryLine);
          const arabicAuditQueries = arQueries.map(normalizeQueryLine);
          const successfulEnglish = new Set(successfulSearches
            .filter(item => item.language === "en").map(item => item.query));
          const successfulArabic = new Set(successfulSearches
            .filter(item => item.language === "ar").map(item => item.query));

          if (new Set(englishAuditQueries).size < 3 ||
              englishAuditQueries.some(query => !successfulEnglish.has(query))) {
            fail("Every English audit query must match a successful logged web search; at least 3 are required.");
          }
          if (new Set(arabicAuditQueries).size < 3 ||
              arabicAuditQueries.some(query => !successfulArabic.has(query))) {
            fail("Every Arabic audit query must match a successful logged web search; at least 3 are required.");
          }
          if (successfulEnglish.size < 3 || successfulArabic.size < 3) {
            fail("At least 3 successful English and 3 successful Arabic web searches are required.");
          }

          function normalizeSourceUrl(value) {
            try {
              const url = new URL(String(value).replace(/[.,;]+$/, ""));
              url.hash = "";
              url.search = "";
              url.pathname = url.pathname.replace(/\/+$/, "") || "/";
              return url.origin.toLowerCase() + url.pathname;
            } catch (_) {
              return String(value).replace(/[.,;]+$/, "");
            }
          }
          const foundUrls = new Set(successfulSearches.flatMap(item =>
            item.results.map(result => normalizeSourceUrl(result.url || ""))
          ));
          const auditSourceUrls = sourceLinks.map(normalizeSourceUrl);
          if (auditSourceUrls.filter(url => foundUrls.has(url)).length < 2) {
            fail("At least 2 English sources in the audit must come from actual logged search results.");
          }

          if (decision === "SKIP") {
            if (createdPosts.length !== 0) {
              fail("Audit says SKIP, but a new article was also created.");
            }
            const changedMetadata = cp.spawnSync("git", ["diff", "--quiet", "--", "posts-data.js"]);
            if (changedMetadata.status !== 0) {
              fail("Audit says SKIP, but posts-data.js was modified.");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=false\n");
            console.log("No article published: research/novelty checks did not pass.");
            process.exit(0);
          }

          if (createdPosts.length !== 1) {
            fail("Expected exactly one new Markdown article in posts/.");
          }

          global.window = {};
          try {
            require("./posts-data.js");
          } catch (error) {
            fail("posts-data.js could not be parsed: " + error.message);
          }
          const posts = global.window.POSTS;
          if (!Array.isArray(posts)) fail("window.POSTS is not an array.");

          const slugs = new Set();
          for (const p of posts) {
            if (!p.slug || !p.title || !p.date || !p.category) {
              fail("Missing required metadata field in posts-data.js.");
            }
            if (slugs.has(p.slug)) fail("Duplicate slug: " + p.slug);
            slugs.add(p.slug);
            if (!fs.existsSync(`posts/${p.slug}.md`)) {
              fail("Metadata has no matching Markdown file: " + p.slug);
            }
          }

          const slug = createdPosts[0].replace(/^posts\//, "").replace(/\.md$/, "");
          const post = posts.find(p => p.slug === slug);
          if (!post || post.date !== process.env.TODAY || post.lang !== "ar") {
            fail("New article metadata must match today's date, slug and Arabic language.");
          }
          const article = fs.readFileSync(createdPosts[0], "utf8");
          if (article.length < 3500) fail("Article is too short.");
          const articleLinks = article.match(/\]\(https?:\/\/[^)\s]+\)/g) || [];
          if (articleLinks.length < 3) fail("Article needs at least 3 direct source links.");
          if (!/[\u0600-\u06FF]/.test(article)) fail("Article content is not Arabic.");

          if (!post.cover || !post.cover.startsWith("images/covers/") || !fs.existsSync(post.cover)) {
            fail("Generated cover is missing or not linked in the post metadata.");
          }
          if (!fs.readFileSync(post.cover, "utf8").includes("<svg")) {
            fail("Generated cover SVG is invalid.");
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=true\n");
          console.log("Research audit and article validation passed: " + slug);
          NODE

      - name: Commit and publish approved article
        if: steps.validate.outputs.publish == 'true'
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ posts-data.js images/covers/
          if git diff --cached --quiet; then
            echo "No article changes to publish."
            exit 1
          fi
          git commit -m "content: publish researched article $TODAY"
          git push
