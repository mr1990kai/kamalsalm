name: Daily Blog Article

on:
  schedule:
    - cron: "7 9 * * *"
      timezone: "Africa/Cairo"
    - cron: "7 19 * * *"
      timezone: "Africa/Cairo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-blog-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get today's Cairo date
        id: date
        run: |
          echo "today=$(TZ=Africa/Cairo date +%F)" >> "$GITHUB_OUTPUT"

      - name: Research and write article with Groq
        id: article
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TODAY: ${{ steps.date.outputs.today }}
        run: node .github/scripts/generate-article-groq.js

      - name: Generate unique topic-specific cover
        if: steps.article.outputs.publish == 'true'
        run: node .github/scripts/generate-cover.js

      - name: Validate translation and prevent near-duplicates
        id: validate
        if: steps.article.outputs.publish == 'true'
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const cp = require("child_process");

          function fail(message) {
            console.error("Validation failed: " + message);
            process.exit(1);
          }
          function normalize(text) {
            return String(text || "")
              .replace(/[\u064B-\u065F\u0670\u0640]/g, "")
              .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
              .toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g, " ")
              .split(/\s+/).filter(Boolean);
          }
          function shingles(text, size) {
            const words = normalize(text), set = new Set();
            for (let i = 0; i <= words.length - size; i++) set.add(words.slice(i, i + size).join(" "));
            return set;
          }
          function similarity(a, b) {
            const A = shingles(a, 5), B = shingles(b, 5);
            if (!A.size || !B.size) return 0;
            let intersection = 0;
            for (const item of A) if (B.has(item)) intersection++;
            return intersection / (A.size + B.size - intersection);
          }
          function bodyOf(text) {
            return String(text || "")
              .split(/\n\s*##\s*(?:المصادر|المراجع|المصدر الأصلي|المصادر الأصلية|sources|references)(?=\s|$)/i)[0]
              .replace(/^#\s+.*$/m, "").trim();
          }

          const audit = fs.existsSync("research-audit.md") ? fs.readFileSync("research-audit.md", "utf8") : "";
          if (!/DECISION:\s*PUBLISH\b/i.test(audit)) fail("No PUBLISH decision in source log.");
          const created = cp.execSync(
            "git ls-files --others --exclude-standard -- 'posts/*.md'",
            { encoding: "utf8" }
          ).trim().split(/\r?\n/).filter(Boolean);
          if (created.length !== 1) fail("Expected exactly one new Markdown article per run.");

          global.window = {};
          try { require("./posts-data.js"); }
          catch (error) { fail("posts-data.js could not be parsed: " + error.message); }
          const posts = global.window.POSTS;
          if (!Array.isArray(posts)) fail("window.POSTS is not an array.");
          const slugs = new Set();
          for (const p of posts) {
            if (!p.slug || !p.title || !p.date || !p.category) fail("Post metadata is incomplete.");
            if (slugs.has(p.slug)) fail("Duplicate post slug: " + p.slug);
            slugs.add(p.slug);
            if (!fs.existsSync("posts/" + p.slug + ".md")) fail("Metadata points to a missing Markdown file: " + p.slug);
            if (!p.cover || !fs.existsSync(p.cover)) fail("Post cover is missing for: " + p.slug);
            if (!fs.readFileSync(p.cover, "utf8").includes("<svg")) fail("Post cover SVG is invalid for: " + p.slug);
          }

          const trackedPosts = cp.execSync("git ls-files -- 'posts/*.md'", { encoding: "utf8" })
            .trim().split(/\r?\n/).filter(Boolean);
          for (const file of new Set(trackedPosts.concat(created))) {
            const fileSlug = file.replace(/^posts\//, "").replace(/\.md$/, "");
            if (!slugs.has(fileSlug)) fail("Markdown article has no posts-data.js metadata: " + file);
          }

          const slug = created[0].replace(/^posts\//, "").replace(/\.md$/, "");
          const post = posts.find(p => p.slug === slug);
          if (!post) fail("The new article has no matching metadata.");
          if (post.date !== process.env.TODAY || post.lang !== "ar") fail("Incorrect date or language metadata.");
          if (!new Set(["البراندينج", "التصميم", "التسويق", "الميديا باينج"]).has(post.category)) {
            fail("Unexpected article category: " + post.category);
          }

          const article = fs.readFileSync(created[0], "utf8");
          if (bodyOf(article).length < 2600) fail("The Arabic translation digest is too short.");
          if (!/[\u0600-\u06ff]/.test(article)) fail("The article body is not Arabic.");
          const links = [...article.matchAll(/\]\((https?:\/\/[^)\s]+)\)/g)].map(match => match[1]);
          if (!links.length) fail("Add the original source link(s) at the end of the article.");

          let log;
          try { log = JSON.parse(fs.readFileSync("web-search-log.json", "utf8")); }
          catch (error) { fail("Search log is missing or invalid: " + error.message); }
          if (!Array.isArray(log) || !log.some(item => item.type === "search" && item.ok === true && item.language === "en")) {
            fail("No successful English-language search was recorded.");
          }
          function urlKey(value) {
            try {
              const url = new URL(value);
              url.hash = ""; url.search = "";
              url.pathname = url.pathname.replace(/\/+$/, "") || "/";
              return url.origin.toLowerCase() + url.pathname;
            } catch (_) { return ""; }
          }
          const found = new Set(log.flatMap(item => (item.results || []).map(result => urlKey(result.url))));
          if (!links.some(link => found.has(urlKey(link)))) fail("At least one source link must come from the actual search results.");

          const tracked = cp.execSync("git ls-files -- 'posts/*.md'", { encoding: "utf8" })
            .trim().split(/\r?\n/).filter(Boolean).filter(file => file !== created[0]);
          const newBody = bodyOf(article);
          for (const file of tracked) {
            let oldText = "";
            try { oldText = cp.execFileSync("git", ["show", "HEAD:" + file], { encoding: "utf8", maxBuffer: 2 * 1024 * 1024 }); }
            catch (_) { continue; }
            const ratio = similarity(newBody, bodyOf(oldText));
            if (ratio > 0.62) fail("Near-duplicate body detected against " + file + " (similarity " + ratio.toFixed(2) + ").");
          }

          if (!post.cover || !post.cover.startsWith("images/covers/") || !fs.existsSync(post.cover)) {
            fail("Generated cover is missing or not linked in posts-data.js.");
          }
          if (!fs.readFileSync(post.cover, "utf8").includes("<svg")) fail("Generated cover SVG is invalid.");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "## Arabic translation digest\n\nCategory: " + post.category + "\n\nOriginal source links are at the end of the post.\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=true\n");
          console.log("Translation and duplicate checks passed: " + slug);
          NODE

      - name: Update sitemap with published article
        if: steps.validate.outputs.publish == 'true'
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const cp = require("child_process");
          global.window = {};
          require("./posts-data.js");
          const posts = global.window.POSTS;
          const created = cp.execSync(
            "git ls-files --others --exclude-standard -- 'posts/*.md'",
            { encoding: "utf8" }
          ).trim().split("\n").filter(Boolean);
          const file = "sitemap.xml";
          let xml = fs.readFileSync(file, "utf8");
          for (const path of created) {
            const slug = path.replace(/^posts\//, "").replace(/\.md$/, "");
            const post = posts.find(item => item.slug === slug);
            if (!post) throw new Error("No metadata found for sitemap entry: " + slug);
            const url = "https://kamalsalm.vercel.app/post.html?p=" + slug;
            if (!xml.includes("<loc>" + url + "</loc>")) {
              const entry = "  <url><loc>" + url + "</loc><lastmod>" +
                (post.date || process.env.TODAY) + "</lastmod></url>\n";
              xml = xml.replace(/<\/urlset>\s*$/, entry + "</urlset>\n");
            }
          }
          fs.writeFileSync(file, xml, "utf8");
          NODE

      - name: Bump article metadata cache version
        if: steps.validate.outputs.publish == 'true'
        run: |
          node <<'NODE'
          const fs = require("fs");
          for (const file of ["blog.html", "post.html"]) {
            const source = fs.readFileSync(file, "utf8");
            let count = 0;
            const updated = source.replace(/posts-data[.]js[?]v=([0-9]+)/g, function(match, version) {
              count++;
              return "posts-data.js?v=" + (Number(version) + 1);
            });
            if (!count) throw new Error("No posts-data.js cache version found in " + file);
            fs.writeFileSync(file, updated, "utf8");
          }
          NODE

      - name: Commit and publish approved article
        if: steps.validate.outputs.publish == 'true'
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ posts-data.js images/covers/ sitemap.xml blog.html post.html
          if git diff --cached --quiet; then
            echo "No article changes to publish."
            exit 1
          fi
          git commit -m "content: publish researched article $TODAY"
          git push
