<main>
  <section class="wrap hero">
    <h1>المقالات</h1>
    <p class="tag">تحليلات عملية في التصميم والبراندينج والميديا باينج والتسويق. كل مقال بيرجع لمصادره الأصلية ويفصل بين المعلومة والرأي.</p>
    <div class="chips" id="chips" aria-label="تصفية حسب المجال"></div>
  </section>
  <div class="wrap">
    <div class="bgrid" id="grid" aria-live="polite"></div>
    <p class="empty" id="empty" hidden>لسه مفيش مقالات في التصنيف ده.</p>

<script src="posts-data.js"></script>
<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s)};
  var lang='ar',current='all',list=Array.isArray(window.POSTS)?window.POSTS.slice():[];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmt(d){try{return new Intl.DateTimeFormat('ar-u-ca-gregory',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T00:00:00'))}catch(e){return d||''}}
  function card(p){
    var cover=p.cover?'<img src="'+esc(p.cover)+'" alt="" loading="lazy" onerror="this.remove()">':esc((p.title||'م').slice(0,1));
    return '<a class="bcard" href="post.html?p='+encodeURIComponent(p.slug)+'"><div class="cv">'+cover+'</div><div class="tx"><div class="ct">'+esc(p.category||'')+'</div><h2>'+esc(p.title||'')+'</h2><p>'+esc(p.excerpt||'')+'</p><div class="mt">'+fmt(p.date)+' · '+esc(p.read||'')+' دقائق قراءة</div></div></a>';
  }
  function render(){
    var items=list.filter(function(p){return current==='all'||p.category===current});
    $('#grid').innerHTML=items.map(card).join('');
    $('#empty').hidden=items.length!==0;
  }
  function drawChips(){
    var cats=[];
    list.forEach(function(p){if(p.category&&cats.indexOf(p.category)===-1)cats.push(p.category)});
    $('#chips').hidden=cats.length<2;
    if(cats.length<2)return;
    $('#chips').innerHTML='<button type="button" class="on" data-f="all">الكل</button>'+cats.map(function(c){return '<button type="button" data-f="'+esc(c)+'">'+esc(c)+'</button>'}).join('');
    $('#chips').addEventListener('click',function(e){
      var b=e.target.closest('button[data-f]');if(!b)return;
      current=b.getAttribute('data-f');
      $('#chips').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});
      render();
    });
  }
  $('#lang').addEventListener('click',function(){
    lang=lang==='ar'?'en':'ar';
    document.documentElement.lang=lang;
    document.documentElement.dir=lang==='ar'?'rtl':'ltr';
    document.body.classList.toggle('en',lang==='en');
    $('#lang').textContent=lang==='ar'?'EN':'AR';
    document.title=lang==='ar'?'مقالات التصميم والبراندينج والتسويق | كمال النحراوي':'Design, Branding & Marketing Articles | Kamal Elnhrawy';
  });
  if(!Array.isArray(window.POSTS))$('#error').hidden=false;
  list.sort(function(a,b){return String(a.date)<String(b.date)?1:-1});
  drawChips();render();
})();
</script>
</body>
