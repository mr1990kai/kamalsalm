<text x="1090" y="575" text-anchor="end" font-family="Plus Jakarta Sans, Tahoma, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5" fill="#38251D">KAMAL ELNHRAWY  /  INSIGHTS</text>
