</g>
<g font-family="Noto Kufi Arabic, Tahoma, sans-serif" text-anchor="end">
  <text x="1090" y="135" font-size="22" font-weight="700" fill="#B85D55">التسويق وصناعة المحتوى</text>
  <text x="1090" y="226" font-size="43" font-weight="700" fill="#38251D">لما العميل يسأل</text>
  <text x="1090" y="286" font-size="43" font-weight="700" fill="#38251D">سؤال طويل…</text>
  <text x="1090" y="355" font-size="31" font-weight="700" fill="#8B5B36">المحتوى لازم يجاوب على إيه؟</text>
  <path d="M770 389 H1090" stroke="#D8AC58" stroke-width="5" stroke-linecap="round"/>
  <text x="1090" y="440" font-size="22" fill="#5D4539">من الكلمات المفتاحية إلى احتياج العميل</text>
  <text x="1090" y="476" font-size="22" fill="#5D4539">خريطة عملية للمحتوى ورحلة الشراء</text>
